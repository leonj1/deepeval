name: Lint

on: [pull_request]

jobs:
  lint:
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v3
      - uses: psf/black@stable
        with:
          options: "--check --verbose"
          src: "."
          jupyter: true
